<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Íconos PNG · ThreeBall 2D</title>
    <style>
      body { margin: 0; padding: 24px; background: #000000; color: #FFFFFF; font: 16px system-ui, sans-serif; }
      ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 24px; }
      canvas { display: block; max-width: 192px; height: auto; background: repeating-conic-gradient(#1F1F1F 0 25%, #000000 0 50%) 0 0 / 16px 16px; }
      a { color: #F1C400; }
    </style>
  </head>
  <body>
    <h1>Íconos PNG</h1>
    <p>Renderiza los SVG de <code>/icons</code>. Descarga cada PNG y guárdalo en <code>/icons</code> con el mismo nombre.</p>
    <ul id="list"></ul>
    <script type="module">
      const targets = [
        ['icon-192.png', 'icon.svg', 192], ['icon-512.png', 'icon.svg', 512],
        ['icon-maskable-512.png', 'icon-maskable.svg', 512], ['apple-touch-icon.png', 'icon-maskable.svg', 180],
      ];
      const list = document.querySelector('#list');
      for (const [name, source, size] of targets) {
        const image = new Image();
        image.src = `../icons/${source}`;
        await image.decode();
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        canvas.getContext('2d').drawImage(image, 0, 0, size, size);
        const link = document.createElement('a');
        link.download = name;
        link.textContent = `Descargar ${name} (${size}×${size})`;
        link.href = URL.createObjectURL(await new Promise(resolve => canvas.toBlob(resolve, 'image/png')));
        const item = document.createElement('li');
        item.append(canvas, link);
        list.append(item);
      }
    </script>
  </body>
</html>
